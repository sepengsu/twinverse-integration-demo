[project]
name = "super-agent"
version = "0.1.0"
description = "A2A super-agent orchestrator with configurable MCP-backed agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2,<2",
    "fastmcp>=4.0.3,<5",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["agent_shared", "cau", "skku", "unist", "ui", "super_agent"]
